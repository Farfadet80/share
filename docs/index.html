<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share se réveille</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #f2f2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }
    img {
      width: 72px;
      height: 72px;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .wait {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0a84ff;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <main>
    <img src="icon-192.png" alt="">
    <h1>Share se réveille</h1>
    <div class="wait" role="status" aria-label="Share se réveille"></div>
  </main>
  <script>
    const app = "https://share-hgeb.onrender.com/";
    let left = false;

    function probe() {
      if (left) return;
      const image = new Image();
      image.onload = function () {
        if (left) return;
        left = true;
        location.replace(app);
      };
      image.src = app + "icon-192.png?t=" + Date.now();
    }

    probe();
    setInterval(probe, 4000);
  </script>
</body>
</html>
